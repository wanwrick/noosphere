name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps (Noosphere + DABs subproject)
        run: |
          pip install pyyaml
          pip install -r templates/dabs-data-product-template/requirements.txt

      - name: Run all 9 verification checks
        id: verify
        run: |
          set +e
          bash -x scripts/verify_all.sh > verify.log 2>&1
          rc=$?
          cat verify.log
          exit $rc

      - name: Post log as PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('verify.log', 'utf8');
            // GitHub comment limit is 65536 chars; truncate generously.
            const trimmed = log.length > 60000 ? log.slice(-60000) : log;
            const body = `### verify_all.sh failure trace\n\n\`\`\`\n${trimmed}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Upload verify log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: verify.log
