name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install pyyaml

      - name: Run all 9 verification checks
        run: bash scripts/verify_all.sh
