name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps (Noosphere + DABs subproject)
        run: |
          pip install pyyaml
          pip install -r templates/dabs-data-product-template/requirements.txt

      - name: Run all 9 verification checks
        id: verify
        run: |
          set +e
          bash -x scripts/verify_all.sh > verify.log 2>&1
          rc=$?
          cat verify.log
          exit $rc

      - name: Upload verify log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: verify.log
