name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep

      - name: Install Python deps (Noosphere + DABs subproject)
        run: |
          pip install pyyaml
          pip install -r templates/dabs-data-product-template/requirements.txt

      - name: Run all 9 verification checks
        run: bash scripts/verify_all.sh
