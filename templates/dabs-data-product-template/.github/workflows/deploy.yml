name: Deploy — DABs Data-Contract Golden Path

on:
  push:
    branches: [main]
    paths:
      - "templates/dabs-data-product-template/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Bundle target (dev|staging|prod)"
        required: true
        default: dev

defaults:
  run:
    working-directory: templates/dabs-data-product-template

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Deploy
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          TARGET="${{ github.event.inputs.target || 'dev' }}"
          bash scripts/deploy.sh "$TARGET"
