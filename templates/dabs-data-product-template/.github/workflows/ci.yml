name: CI — DABs Data-Contract Golden Path

on:
  pull_request:
    paths:
      - "templates/dabs-data-product-template/**"
  push:
    branches: [main]
    paths:
      - "templates/dabs-data-product-template/**"

defaults:
  run:
    working-directory: templates/dabs-data-product-template

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
      - name: ruff
        run: ruff check src tests scripts
      - name: pytest (unit)
        run: pytest tests/unit/ -v --tb=short
      - name: validate_bundle.sh (6-check gate)
        run: bash scripts/validate_bundle.sh
