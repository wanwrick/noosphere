# .pre-commit-config.yaml — Noosphere Practice OS gates.
#
# Runs sanitization-lint + gitleaks on every commit so banned tokens never
# ship. Install with:
#   pip install pre-commit
#   pre-commit install
#
# FIRST, bootstrap your lexicon (once per clone) — the real banned-token list
# is gitignored and is NOT in this repo:
#   cp .sanitization-lexicon.example .sanitization-lexicon.local
#   # then replace the placeholders with your real terms
# Without it the lint runs on placeholders and prints a NOT-PROTECTED warning.
#
# Run manually:
#   pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: sanitization-lint
        name: sanitization-lint (banned-token guard)
        entry: bash scripts/lint_sanitization.sh
        language: system
        pass_filenames: false
        always_run: true
        description: |
          Refuses any commit that introduces an employer / team / stakeholder /
          JIRA / Databricks-internal-ID token. Terms load at runtime from
          .sanitization-lexicon.local (gitignored). See _Logs/sanitization-audit.md
          for rationale and Workflows/sanitization-pass.md for remediation.

      - id: pii-lint
        name: pii-lint (personal data guard)
        entry: python3 scripts/lint_pii.py
        language: system
        pass_filenames: false
        always_run: true
        description: |
          Refuses any commit that introduces personal data — email, phone,
          SIN / SSN, payment card, IP address, postal address, date of birth,
          passport or licence number. Rules live in .pii-patterns and false
          positives in .pii-allowlist; both are tracked, because generic format
          regexes identify nobody. See Workflows/pii-audit-pass.md.

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args:
          - "detect"
          - "--config=.gitleaks.toml"
          - "--redact"
          - "--no-banner"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '^(\.github/|templates/dabs-data-product-template/data-contract\.yml)$'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
