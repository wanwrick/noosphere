# .gitleaks.toml — secret scanning for Noosphere Practice OS.
#
# SCOPE: secrets and structural identifiers only.
#
# The banned-token lexicon (employer / team / vendor / stakeholder proper
# nouns) deliberately does NOT live here. Earlier revisions of this file
# spelled those terms out in plaintext, which published the exact list the
# sanitization invariant exists to protect — in a public repository, in the
# file whose job was to prevent that. Proper-noun matching now lives in
# scripts/lint_sanitization.sh, which loads a gitignored lexicon at runtime.
# See .sanitization-lexicon.example and _Logs/sanitization-audit.md.
#
# Only generic, non-identifying format patterns belong in this file.
#
# Run locally: gitleaks detect --redact --config=.gitleaks.toml --source .
# Run in CI: see .github/workflows/sanitization.yml

title = "Noosphere Secret Scanning"

[extend]
useDefault = true   # Stock secret scanning (AWS keys, GitHub tokens, etc.).

# ---------------------------------------------------------------------------
# Structural identifier rules.
# These are generic formats. They identify no person, employer, or vendor, so
# they are safe to keep in a public file.
# ---------------------------------------------------------------------------

[[rules]]
id = "noosphere-databricks-workspace-id"
description = "Databricks workspace identifier."
regex = '''\bdbc-[a-f0-9]{8}-[a-f0-9]{4}\b'''
tags = ["sanitization", "databricks-leak"]

[[rules]]
id = "noosphere-databricks-cluster-id"
description = "Databricks cluster identifier."
regex = '''clusterId\s*[:=]\s*["']?[0-9]{4}-[0-9]{6}-[a-z0-9]{8}["']?'''
tags = ["sanitization", "databricks-leak"]

[[rules]]
id = "noosphere-databricks-workspace-numeric"
description = "Numeric Databricks workspace ID assigned to a config key."
regex = '''(?i)workspace[_-]?id\s*[:=]\s*["']?[0-9]{10,}["']?'''
tags = ["sanitization", "databricks-leak"]

# ---------------------------------------------------------------------------
# Allowlist — the lexicon files are the only legitimate holders of banned
# tokens. Nothing else is exempt: excluding the sanitization tooling from its
# own scan is what let the lexicon sit unnoticed in tracked files.
# ---------------------------------------------------------------------------

[allowlist]
description = "Lexicon files only."
paths = [
  '''\.sanitization-lexicon\.example''',
  '''\.sanitization-lexicon\.local''',
]
